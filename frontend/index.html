<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <!-- viewport-fit=cover: draw under notches (safe-area padding is in app.css).
         interactive-widget: the on-screen keyboard shrinks the page, so the composer stays visible. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Anemo</title>
    <!-- Installable app ("Add to Home Screen"); see public/manifest.webmanifest and public/sw.js. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2" />
    <meta name="apple-mobile-web-app-title" content="Anemo" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Browser/status bar colour; kept in sync with the theme by applyAppearance(). -->
    <meta name="theme-color" content="#f4f5f8" />
    <script>
      // Apply the cached appearance before first paint, so nothing flashes in the default
      // colours. The values were worked out by src/features/appearance/apply.ts (lookFor)
      // and cached under anemo.appearance.css; this only copies them onto <html>.
      // Older caches (aiw.appearance: mode, density, accent) still work.
      try {
        var root = document.documentElement
        var look = JSON.parse(localStorage.getItem('anemo.appearance.css') || 'null')
        var old = JSON.parse(localStorage.getItem('aiw.appearance') || '{}')
        var mode = (look && look.mode) || old.mode || 'system'
        if (mode === 'system') {
          mode = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        root.dataset.theme = mode
        root.dataset.density = (look && look.density) || old.density || 'comfortable'
        root.dataset.glass = look && look.glass ? 'on' : 'off'
        root.dataset.background = look && look.background ? 'on' : 'off'
        var vars = look && look[mode]
        if (vars) {
          for (var name in vars) {
            if (/^--[a-z0-9-]+$/.test(name)) root.style.setProperty(name, String(vars[name]))
          }
        } else if (old.accent) {
          root.style.setProperty('--accent', old.accent)
        }
        var bg = (vars && vars['--bg']) || (mode === 'dark' ? '#0e1014' : '#eceef2')
        document.querySelector('meta[name=theme-color]').content = bg
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
