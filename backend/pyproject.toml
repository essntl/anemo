[project]
name = "ai-workspace"
version = "0.1.0"
description = "Self-hosted single-user AI workspace and agent runtime"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "redis>=5.2",
  "argon2-cffi>=23.1",
  "cryptography>=43",
  "httpx>=0.28",
  "openai>=1.60",
  "anthropic>=0.45",
  "pgvector>=0.3",
  "python-multipart>=0.0.20",
  "pypdf>=5.1",
  "pillow>=11",
  "pyyaml>=6",
  "trafilatura>=2.0",
  "python-dateutil>=2.9",
  "tzdata>=2025.1",
  "cronsim>=2.6",
  "mcp>=1.20",
  "jsonschema>=4.23",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.8",
  "mypy>=1.13",
  "asgi-lifespan>=2.1",
  "hypothesis>=6.120",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"migrations/**" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: needs Postgres and Valkey (set TEST_DATABASE_URL / TEST_REDIS_URL)"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
