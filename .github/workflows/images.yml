# Builds Anemo's images and publishes them to GitHub's container registry, so an
# install can pull them instead of building:
#   ghcr.io/essntl/anemo                  the app and its background worker
#   ghcr.io/essntl/anemo-sandbox          the shell sandbox (sandbox and sandbox-net)
#   ghcr.io/essntl/anemo-browser          the browser agents can drive
#   ghcr.io/essntl/anemo-mcp-host         runs local MCP servers
#   ghcr.io/essntl/anemo-claude-runner    Claude Code sessions (Claude subscription)
# For linux/amd64 (x86-64) and linux/arm64 (Apple Silicon, Raspberry Pi 4/5, ARM
# servers): each is built on a runner of its own CPU type (no emulation), pushed by
# digest only, and the two are then joined under one tag, so `docker pull` picks the
# right one. Tags: latest (main), sha-<short> (every build), <version> (v* tags);
# the runner is also tagged claude-code-<CLI version>. Nothing is tagged unless both
# builds (and the runner's tests, on both) passed.
# Runs on every push to main, on version tags, and by hand (Actions > Images >
# Run workflow). Unchanged images rebuild from the layer cache in seconds.
name: Images

on:
  push:
    branches: [main]
    # v1.2.3 and the like only: not desktop-v*/voice-v* (release.yml), "voice-v…" starts with v.
    tags: ["v[0-9]*"]
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ matrix.image }} (linux/${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        image: [anemo, anemo-sandbox, anemo-browser, anemo-mcp-host, anemo-claude-runner]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
          - image: anemo
            context: .
            dockerfile: backend/Dockerfile
          - image: anemo-sandbox
            context: sandbox
            dockerfile: sandbox/Dockerfile
          - image: anemo-browser
            context: browser
            dockerfile: browser/Dockerfile
          - image: anemo-mcp-host
            context: mcp-host
            dockerfile: mcp-host/Dockerfile
          - image: anemo-claude-runner
            context: claude-runner
            dockerfile: claude-runner/Dockerfile
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels only; the tags are set when the two builds are joined (merge job).
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          # Pushed without a tag: the merge job tags the pair once both are here.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # The app records the commit it was built from (the update notice compares it
          # with main) and that it is a prebuilt image (Settings > Advanced shows the
          # matching update command). Other images ignore these.
          build-args: |
            APP_COMMIT=${{ github.sha }}
            APP_INSTALL=image
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

      # The runner's tests (real Claude Code CLI, fake API) against the pushed image,
      # on each CPU type, before anything is tagged.
      - name: Test the pushed runner image
        if: matrix.image == 'anemo-claude-runner'
        run: >
          docker run --rm -u root -v "$PWD/claude-runner:/src" -w /src
          --entrypoint sh "${IMAGE}@${{ steps.build.outputs.digest }}" /src/tests/run.sh

      - name: Record the digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          # <image>-digest-<arch>: the merge job's pattern for `anemo` must not also
          # match `anemo-sandbox` and the others.
          name: ${{ matrix.image }}-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Joins the amd64 and arm64 builds of each image under its tags.
  merge:
    name: ${{ matrix.image }} (tag)
    needs: build
    # Each image on its own: one image failing does not hold back the others.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: [anemo, anemo-sandbox, anemo-browser, anemo-mcp-host, anemo-claude-runner]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
    steps:
      - uses: actions/checkout@v5
        if: matrix.image == 'anemo-claude-runner'

      # The runner pins a Claude Code version (checked again inside its build).
      - name: Read the pinned Claude Code version
        id: cli
        if: matrix.image == 'anemo-claude-runner'
        run: echo "version=$(sed -n 's/^ARG CLAUDE_CODE_VERSION=//p' claude-runner/Dockerfile)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: ${{ matrix.image }}-digest-*
          merge-multiple: true

      # Never publish a tag that is missing one of the CPU types.
      - name: Check both builds are here
        working-directory: ${{ runner.temp }}/digests
        run: |
          count=$(ls | wc -l)
          if [ "$count" -ne 2 ]; then
            echo "::error::expected 2 builds (amd64, arm64) of ${{ matrix.image }}, found $count"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=claude-code-${{ steps.cli.outputs.version }},enable=${{ steps.cli.outputs.version != '' && github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Tag both builds as one image
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Show the published image
        run: docker buildx imagetools inspect "${IMAGE}:sha-${GITHUB_SHA::7}"
