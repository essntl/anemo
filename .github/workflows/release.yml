# Publishes the native clients to GitHub Releases:
#   desktop-v<version>  Anemo Desktop: single-file, self-contained exes for win-x64 and win-arm64
#   voice-v<version>    Anemo Voice: the APK, signed with the release key (repository secrets)
# The server's Docker images use v<version> tags (images.yml); these prefixes keep them apart.
# A tag must match the version in the source (desktop/Directory.Build.props, versionName in
# android/app/build.gradle.kts) and be on main, or nothing is published.
# Run by hand (Actions > Release > Run workflow) or on a pull request that touches this file
# or a version, it is a dry run: the files are built and kept as workflow artifacts, and no
# Release is made. How to cut a release: desktop/README.md and android/README.md.
name: Release

on:
  push:
    tags: ["desktop-v*", "voice-v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - desktop/Directory.Build.props
      - desktop/src/Anemo.Desktop/Anemo.Desktop.csproj
      - android/app/build.gradle.kts
  workflow_dispatch:
    inputs:
      app:
        description: Which app to build (dry run, no Release)
        type: choice
        options: [both, desktop, voice]
        default: both

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  desktop:
    name: Anemo Desktop (win-x64, win-arm64)
    if: >-
      startsWith(github.ref, 'refs/tags/desktop-v') || github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.app != 'voice')
    # On Windows the SDK writes the version resources into the exe (on Linux it can't).
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read the version, check it against the tag
        id: version
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::no x.y.z <Version> in desktop/Directory.Build.props (found '$version')"
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [ "$GITHUB_REF_NAME" != "desktop-v$version" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match <Version>$version</Version> (expected desktop-v$version)"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::tag $GITHUB_REF_NAME is not on main"
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Anemo Desktop $version"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish the single-file exes
        run: |
          mkdir -p dist
          for rid in win-x64 win-arm64; do
            dotnet publish src/Anemo.Desktop/Anemo.Desktop.csproj -c Release -r "$rid" -o "publish/$rid"
            cp "publish/$rid/Anemo Desktop.exe" "dist/Anemo-Desktop-$rid.exe"
          done
          cd dist && sha256sum *.exe | tee SHA256SUMS-desktop.txt

      - name: Check the version resources in the exes
        shell: pwsh
        run: |
          foreach ($rid in 'win-x64', 'win-arm64') {
            $info = (Get-Item "dist/Anemo-Desktop-$rid.exe").VersionInfo
            "$rid`: $($info.ProductName) $($info.ProductVersion) (file $($info.FileVersion)), $((Get-Item "dist/Anemo-Desktop-$rid.exe").Length) bytes"
            if ($info.ProductName -ne 'Anemo Desktop' -or -not $info.ProductVersion.StartsWith('${{ steps.version.outputs.version }}')) {
              throw "dist/Anemo-Desktop-$rid.exe has no Anemo Desktop ${{ steps.version.outputs.version }} version resource"
            }
          }

      - name: Release notes
        run: |
          {
            echo "Anemo Desktop ${{ steps.version.outputs.version }}, the Windows client."
            echo
            echo "- \`Anemo-Desktop-win-x64.exe\`: Intel and AMD PCs"
            echo "- \`Anemo-Desktop-win-arm64.exe\`: ARM PCs (Snapdragon)"
            echo
            echo "One self-contained exe (the .NET runtime included; no install, no admin rights)."
            echo "Rename it to \`Anemo Desktop.exe\` and replace the old one in its folder (quit the"
            echo "client from the tray first); the exe is not signed, so SmartScreen asks once."
            echo "Setup: [desktop/README.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/desktop/README.md)."
            echo
            echo "SHA-256:"
            echo '```'
            cat dist/SHA256SUMS-desktop.txt
            echo '```'
          } > dist/notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: anemo-desktop-${{ steps.version.outputs.version }}
          path: desktop/dist/
          if-no-files-found: error
          retention-days: 14

  voice:
    name: Anemo Voice (APK)
    if: >-
      startsWith(github.ref, 'refs/tags/voice-v') || github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.app != 'desktop')
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: android
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read the version, check it against the tag
        id: version
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          code=$(sed -n 's/^ *versionCode = \([0-9]*\)$/\1/p' app/build.gradle.kts)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || [ -z "$code" ]; then
            echo "::error::no x.y.z versionName and versionCode in android/app/build.gradle.kts (found '$version', '$code')"
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [ "$GITHUB_REF_NAME" != "voice-v$version" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match versionName $version (expected voice-v$version)"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::tag $GITHUB_REF_NAME is not on main"
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Anemo Voice $version (versionCode $code)"

      # The release key from the repository secrets. A tag build without them fails; a dry
      # run without them signs with a throwaway key (that APK can't update a real install).
      - name: Signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          ks="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$ks"
            echo "kind=release" >> "$GITHUB_OUTPUT"
            echo "Signing with the release key (alias from ANDROID_KEY_ALIAS)"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "::error::the release key is missing: set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS (android/README.md, Cut a release)"
            exit 1
          else
            keytool -genkeypair -keystore "$ks" -storetype PKCS12 -storepass throwaway \
              -alias throwaway -keyalg RSA -keysize 2048 -validity 1 \
              -dname "CN=Anemo Voice dry run (throwaway key)" -noprompt
            echo "kind=throwaway" >> "$GITHUB_OUTPUT"
            echo "::warning::no release key in the repository secrets: this dry run's APK is signed with a throwaway key"
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Build the release APK
        env:
          ANEMO_VOICE_KEYSTORE: ${{ runner.temp }}/release.jks
          ANEMO_VOICE_KEYSTORE_PASSWORD: ${{ steps.key.outputs.kind == 'release' && secrets.ANDROID_KEYSTORE_PASSWORD || 'throwaway' }}
          ANEMO_VOICE_KEY_ALIAS: ${{ steps.key.outputs.kind == 'release' && secrets.ANDROID_KEY_ALIAS || 'throwaway' }}
          ANEMO_VOICE_KEY_PASSWORD: ${{ steps.key.outputs.kind == 'release' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: ./gradlew assembleRelease

      - name: Check the signature
        id: cert
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/cert.txt"
          # "Signer #1 certificate …" or "V2 Signer: certificate …", by apksigner version.
          grep -qx 'Number of signers: 1' "$RUNNER_TEMP/cert.txt" || { echo "::error::$apk does not have exactly one signer"; exit 1; }
          sha=$(grep -m1 -oP 'certificate SHA-256 digest: \K[0-9a-f]{64}' "$RUNNER_TEMP/cert.txt" || true)
          [ -n "$sha" ] || { echo "::error::no signing certificate in $apk"; exit 1; }
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          cp "$apk" dist/Anemo-Voice.apk
          rm -f "$RUNNER_TEMP/release.jks"
          cd dist && sha256sum Anemo-Voice.apk | tee SHA256SUMS-voice.txt

      - name: Release notes
        run: |
          {
            echo "Anemo Voice ${{ steps.version.outputs.version }}, the Android app (Android 10 or later)."
            echo
            echo "Install \`Anemo-Voice.apk\` over the old version (allow installs from your browser or"
            echo "file manager); settings and the token stay."
            echo "Setup: [android/README.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/android/README.md)."
            echo
            if [ "${{ steps.key.outputs.kind }}" = throwaway ]; then
              echo "**Dry run: signed with a throwaway key, not the release key.**"
              echo
            fi
            echo "Signing certificate SHA-256: \`${{ steps.cert.outputs.sha256 }}\`"
            echo
            echo "SHA-256:"
            echo '```'
            cat dist/SHA256SUMS-voice.txt
            echo '```'
          } > dist/notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: anemo-voice-${{ steps.version.outputs.version }}
          path: android/dist/
          if-no-files-found: error
          retention-days: 14

  # Only for a tag: the build jobs above never get write access.
  release:
    name: GitHub Release
    needs: [desktop, voice]
    if: github.event_name == 'push' && !cancelled() && !failure()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: ${{ startsWith(github.ref_name, 'desktop-v') && 'anemo-desktop-*' || 'anemo-voice-*' }}
          merge-multiple: true

      - name: Create the Release (or add the files again on a re-run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv dist/notes.md notes.md
          ls -l dist
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
          fi
