# Runs on every push and pull request: the same checks as locally (see the Makefile).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which jobs this change needs (.github/scripts/changed-jobs.sh: the same rules as the CI
  # container's `changed`). A push to main runs everything; a docs-only PR runs nothing heavy.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.jobs.outputs.backend }}
      frontend: ${{ steps.jobs.outputs.frontend }}
      browser: ${{ steps.jobs.outputs.browser }}
      claude-runner: ${{ steps.jobs.outputs.claude-runner }}
      extension: ${{ steps.jobs.outputs.extension }}
      e2e: ${{ steps.jobs.outputs.e2e }}
      desktop: ${{ steps.jobs.outputs.desktop }}
      android: ${{ steps.jobs.outputs.android }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2 # a pull request's merge commit and its first parent, the base
      - id: jobs
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            sh .github/scripts/changed-jobs.sh HEAD^1 | tee -a "$GITHUB_OUTPUT"
          else
            sh .github/scripts/changed-jobs.sh --all | tee -a "$GITHUB_OUTPUT"
          fi

  app-versions:
    name: App versions (a changed app gets a new version, so it is released)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: sh .github/scripts/check-app-versions.sh "${{ github.event.pull_request.base.sha }}"

  backend:
    name: Backend (lint, types, tests, migrations)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The source folder is mounted into the container, and the tools write their
      # caches there, so the container must run as the user that owns the checkout.
      - name: Settings for a throwaway stack
        run: |
          cat > .env <<EOF
          APP_SECRET_KEY=$(openssl rand -hex 32)
          POSTGRES_PASSWORD=$(openssl rand -hex 16)
          ADMIN_PASSWORD=$(openssl rand -hex 12)
          WORKSPACE_PATH=./workspace-dev
          PUID=$(id -u)
          EOF
          mkdir -p workspace-dev && chmod 777 workspace-dev
      # Docker's layer cache in GitHub's cache (.github/ci/compose-cache*.yml): buildx needs
      # the cache service's token and URLs, which only actions see, so pass them on.
      - uses: docker/setup-buildx-action@v3
      - uses: actions/github-script@v7
        with:
          script: |
            for (const [k, v] of Object.entries(process.env))
              if (k.startsWith('ACTIONS_')) core.exportVariable(k, v)
      # The committed OpenAPI schema is mounted for the API contract test.
      - name: Lint, type-check, test (in the dev container, with Postgres and Valkey)
        run: >
          docker compose -f docker-compose.yml -f docker-compose.dev.yml -f .github/ci/compose-cache-dev.yml
          run --rm -e ENV=test
          -v "$PWD/frontend/src/api/openapi.json:/openapi.json:ro" -e OPENAPI_SNAPSHOT=/openapi.json app
          sh -c "ruff check . && ruff format --check . && mypy app && lint-imports && pytest -q -p no:logging -n auto && alembic check"

  frontend:
    name: Frontend (types, lint, tests, build)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint:imports
      - run: npm test
      - run: npm run build

  browser-service:
    name: Browser service (real Chromium)
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: docker-compose.yml:.github/ci/compose-cache.yml
    steps:
      - uses: actions/checkout@v5
      # Docker's layer cache in GitHub's cache (.github/ci/compose-cache*.yml): buildx needs
      # the cache service's token and URLs, which only actions see, so pass them on.
      - uses: docker/setup-buildx-action@v3
      - uses: actions/github-script@v7
        with:
          script: |
            for (const [k, v] of Object.entries(process.env))
              if (k.startsWith('ACTIONS_')) core.exportVariable(k, v)
      - name: Settings so compose can read the file
        run: printf 'APP_SECRET_KEY=%s\nPOSTGRES_PASSWORD=x\n' "$(openssl rand -hex 32)" > .env
      - run: docker compose --profile browser build browser
      - name: Tests inside the browser image
        run: >
          docker compose --profile browser run --rm --no-deps -T
          -v "$PWD/browser:/src:ro" --entrypoint sh browser /src/tests/run.sh

  claude-runner:
    name: Claude runner (pinned Claude Code CLI, fake API)
    needs: changes
    if: needs.changes.outputs.claude-runner == 'true'
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: docker-compose.yml:.github/ci/compose-cache.yml
    steps:
      - uses: actions/checkout@v5
      # Docker's layer cache in GitHub's cache (.github/ci/compose-cache*.yml): buildx needs
      # the cache service's token and URLs, which only actions see, so pass them on.
      - uses: docker/setup-buildx-action@v3
      - uses: actions/github-script@v7
        with:
          script: |
            for (const [k, v] of Object.entries(process.env))
              if (k.startsWith('ACTIONS_')) core.exportVariable(k, v)
      - name: Settings so compose can read the file
        run: printf 'APP_SECRET_KEY=%s\nPOSTGRES_PASSWORD=x\n' "$(openssl rand -hex 32)" > .env
      - run: docker compose --profile claude build claude-runner
      - name: Tests inside the claude-runner image
        run: >
          docker run --rm -u root -v "$PWD/claude-runner:/src" -w /src
          --entrypoint sh anemo-claude-runner:latest /src/tests/run.sh

  e2e:
    name: End-to-end (throwaway stack, scripted model)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    env:
      COMPOSE_FILE: docker-compose.yml:.github/ci/compose-cache.yml
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      # Docker's layer cache in GitHub's cache (.github/ci/compose-cache*.yml): buildx needs
      # the cache service's token and URLs, which only actions see, so pass them on.
      - uses: docker/setup-buildx-action@v3
      - uses: actions/github-script@v7
        with:
          script: |
            for (const [k, v] of Object.entries(process.env))
              if (k.startsWith('ACTIONS_')) core.exportVariable(k, v)
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-e2e-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}
      - run: npm ci
        working-directory: e2e
      # Survives an unreachable Ubuntu mirror: see the script.
      - name: Install the test browser
        run: sh ../.github/scripts/install-test-browser.sh
        working-directory: e2e
      - run: sh e2e/run-isolated.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-traces
          path: e2e/test-results
          retention-days: 7

  extension:
    name: Browser extension (types, lint, tests, build, e2e)
    needs: changes
    if: needs.changes.outputs.extension == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-extension-${{ runner.os }}-${{ hashFiles('extension/package-lock.json') }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run build:browser
      # Survives an unreachable Ubuntu mirror: see the script.
      - name: Install the test browser
        run: sh ../.github/scripts/install-test-browser.sh
      - run: npm run e2e

  desktop:
    name: Windows client (build, tests)
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      # The whole solution: the Windows app, the Mac host (it builds anywhere) and the Core tests
      # (the Mac smoke tests are skipped off macOS).
      - run: dotnet build -c Release -p:EnableWindowsTargeting=true
      - run: dotnet test -c Release -p:EnableWindowsTargeting=true
      # The Claude Code bridge for agents (bridge/cc.mjs), with a fake claude.
      - run: node --test ../bridge/cc.test.mjs

  desktop-macos:
    name: macOS client (Apple Silicon build, tests, app bundle, bridge)
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    # macos-15 runners are Apple Silicon (arm64). No Screen Recording or Accessibility there:
    # what needs them is in docs/specs/09-desktop-macos-mac-testing.md.
    runs-on: macos-15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: dotnet build -c Release -p:EnableWindowsTargeting=true
      # Core's tests on macOS.
      - run: dotnet test tests/Anemo.Desktop.Tests -c Release --no-build
      # The Mac host's smoke tests for real (posix_spawn and the process-group kill, zsh, the
      # Keychain, Objective-C blocks, displays, the clipboard). --blame names the test that
      # was running if a native call crashes the test host.
      - run: dotnet test tests/Anemo.Desktop.Mac.Tests -c Release --no-build --blame --logger "console;verbosity=normal"
      # The .app, signed ad hoc (no secrets in CI), checked with codesign --verify.
      - run: sh mac/build-app.sh osx-arm64
      - name: The bundle's Info.plist is valid and its executable is arm64
        run: |
          plutil -lint "publish/osx-arm64/Anemo Desktop.app/Contents/Info.plist"
          file "publish/osx-arm64/Anemo Desktop.app/Contents/MacOS/Anemo Desktop" | tee /dev/stderr | grep -q arm64
      # What the updater runs before it swaps a new version in (docs/specs/23-desktop-auto-update.md).
      - name: The app answers --self-test with its version
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)
          said=$("publish/osx-arm64/Anemo Desktop.app/Contents/MacOS/Anemo Desktop" --self-test)
          echo "$said"
          [ "$said" = "Anemo Desktop $version" ]
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: desktop/publish/Anemo-Desktop-macos-arm64.zip
          if-no-files-found: error
          retention-days: 14
      - run: node --test ../bridge/cc.test.mjs

  android:
    name: Android app (tests, debug build)
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      # The runner image has the Android SDK (ANDROID_HOME) with its licences accepted;
      # Gradle fetches the platform and build tools the project asks for.
      - run: ./gradlew test assembleDebug

  # The one check branch protection needs: it runs every time, and fails when a job that ran
  # failed or was cancelled. Jobs skipped because the change didn't touch them count as passed.
  ci-ok:
    name: CI passed
    if: always()
    needs: [changes, app-versions, backend, frontend, browser-service, claude-runner, e2e, extension, desktop, desktop-macos, android]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "results: ${{ join(needs.*.result, ' ') }}"
          case " ${{ join(needs.*.result, ' ') }} " in
            *" failure "*|*" cancelled "*) echo "::error::a CI job failed"; exit 1 ;;
          esac
