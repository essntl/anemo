# Builds the claude-runner image (Claude subscription provider) and publishes it to
# GitHub's container registry, so it can be pulled instead of built:
#   ghcr.io/essntl/anemo-claude-runner:latest
# x86-64 only. Built on every push to main that touches claude-runner/, on version
# tags, and by hand (Actions > claude-runner image > Run workflow).
name: claude-runner image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "claude-runner/**"
      - ".github/workflows/claude-runner-image.yml"
  workflow_dispatch:

concurrency:
  group: claude-runner-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/anemo-claude-runner

jobs:
  image:
    name: Build and push (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The Claude Code version the image pins (checked again inside the build).
      - name: Read the pinned Claude Code version
        id: cli
        run: echo "version=$(sed -n 's/^ARG CLAUDE_CODE_VERSION=//p' claude-runner/Dockerfile)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=claude-code-${{ steps.cli.outputs.version }},enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: claude-runner
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The same tests CI runs, against the image that was just published.
      - name: Test the published image
        run: >
          docker run --rm -u root -v "$PWD/claude-runner:/src" -w /src
          --entrypoint sh "${{ env.IMAGE }}:sha-${GITHUB_SHA::7}" /src/tests/run.sh
