# anemo — production stack.
#   cp .env.example .env   (fill in the required values)
#   docker compose up -d
#
# Only the `app` service publishes a port. Point Nginx Proxy Manager at it.

name: ai-workspace

x-backend: &backend
  image: ai-workspace-backend:${APP_VERSION:-latest}
  build:
    context: .
    dockerfile: backend/Dockerfile
    args:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
  restart: unless-stopped
  environment: &backend-env
    ENV: ${ENV:-production}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    DATABASE_URL: postgresql+asyncpg://aiw:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/aiw
    REDIS_URL: redis://valkey:6379/0
    APP_SECRET_KEY: ${APP_SECRET_KEY:?set APP_SECRET_KEY in .env}
    ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
    ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
    COOKIE_SECURE: ${COOKIE_SECURE:-true}
    FORWARDED_ALLOW_IPS: ${TRUSTED_PROXIES:-127.0.0.1}
    TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1}
    TZ: ${TZ:-UTC}
    WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
    SEARXNG_URL: ${SEARXNG_URL:-}
    ENABLE_FAKE_PROVIDER: ${ENABLE_FAKE_PROVIDER:-false}
  volumes:
    - appdata:/data
    - ${WORKSPACE_PATH:-./workspace-dev}:/workspace
  networks: [core]

# The shell sandbox (see sandbox/Dockerfile). Agent commands only ever run here:
# no root, no Linux capabilities, read-only system files, resource limits, and only
# the workspace mounted. Each sandbox sits on its own internal network shared only
# with the worker, so it can't reach the database, Valkey, the app or the other sandbox.
x-sandbox: &sandbox
  image: ai-workspace-sandbox:${APP_VERSION:-latest}
  build:
    context: ./sandbox
    args:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 512
  mem_limit: ${SANDBOX_MEMORY:-2g}
  cpus: ${SANDBOX_CPUS:-2}
  tmpfs:
    - /tmp:size=512m,mode=1777
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7070/health')"]
    interval: 30s
    timeout: 5s
    retries: 3

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: aiw
      POSTGRES_DB: aiw
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiw -d aiw"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [core]

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    # Redis only holds ephemeral streams/signals; no persistence needed.
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [core]

  migrate:
    <<: *backend
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  app:
    <<: *backend
    volumes:
      - appdata:/data
      - ${WORKSPACE_PATH:-./workspace-dev}:/workspace
      # Read-only, to show the agents' SSH public key in Settings.
      - sandbox-ssh:/run/sandbox-ssh:ro
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    <<: *backend
    command: ["python", "-m", "app.main_worker"]
    volumes:
      - appdata:/data
      - ${WORKSPACE_PATH:-./workspace-dev}:/workspace
      # Each sandbox writes a fresh access token here on start; only the worker reads it.
      - sandbox-token:/run/sandbox-token/sandbox:ro
      - sandbox-net-token:/run/sandbox-token/sandbox-net:ro
    networks: [core, sandbox_int, sandbox_net_int]
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.cli", "worker-health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Commands without network access (the default).
  sandbox:
    <<: *sandbox
    volumes:
      - ${WORKSPACE_PATH:-./workspace-dev}:/workspace
      - sandbox-home:/home/agent
      - sandbox-token:/run/execd
    networks: [sandbox_int]

  # Commands the agent runs with internet access (needs the "Shell with network"
  # permission). Note: "internet" includes your LAN, like any container with egress.
  sandbox-net:
    <<: *sandbox
    environment:
      EXECD_SSH: "1"  # create the agents' SSH key (see Settings > Agent Permissions)
    # Lets commands reach the Docker host itself, e.g. `ssh you@host.docker.internal`.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${WORKSPACE_PATH:-./workspace-dev}:/workspace
      - sandbox-net-home:/home/agent
      - sandbox-ssh:/home/agent/.ssh
      - sandbox-net-token:/run/execd
    networks: [sandbox_net_int, egress]

volumes:
  pgdata:
  appdata:
  sandbox-home:
  sandbox-net-home:
  sandbox-token:
  sandbox-net-token:
  sandbox-ssh:

networks:
  core:
  # internal: no route to the outside world.
  sandbox_int:
    internal: true
  sandbox_net_int:
    internal: true
  egress:
